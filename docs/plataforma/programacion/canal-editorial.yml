# ============================================================================
# CANAL EDITORIAL — EJECUCION PROGRAMADA
#
# ESTE ARCHIVO NO ESTA INSTALADO Y NO CORRE.
#
# Vive en `docs/plataforma/programacion/` y no en `.github/workflows/`, que es
# donde GitHub lo buscaria. Mientras siga aqui, no existe para GitHub: no hay
# cron, no hay ejecucion, no hay consumo. Activarlo es UNA decision de Rodrigo y
# UN movimiento de archivo, y las dos cosas son suyas.
#
# Hay ademas una razon mecanica para que este aqui: el token con el que trabaja
# el agente tiene alcance `gist, read:org, repo` y NO tiene `workflow`, asi que
# un commit que tocara `.github/workflows/` seria rechazado al empujar. No es un
# rodeo a la restriccion: es la restriccion funcionando, y se deja escrito.
#
# ---------------------------------------------------------------------------
# POR QUE GITHUB ACTIONS Y NO OTRA COSA
#
# Se midieron cinco opciones con lo que YA existe. Actions en este mismo
# repositorio es la unica donde el entorno cumple los cuatro requisitos sin
# construir nada: Node 24 ya se usa en `ci.yml`, hay red saliente, el checkout
# es escribible para la bitacora, y el repo ya tiene CI gobernado.
#
#   - VPS propio: corre crons hoy, pero faltan runtime de Node y acceso. Dos
#     huecos en vez de uno.
#   - n8n (self-hosted): dispara, no ejecuta Node. Habria que reescribir la
#     etapa de redaccion como nodos.
#   - n8n personal: nada programado corre ahi.
#   - Vercel cron: no hay `vercel.json`, invoca una ruta HTTP y no persiste
#     ficheros. El modelo de ejecucion no encaja.
#
# LO QUE FALTA, Y ES UNA SOLA COSA: una credencial de inferencia utilizable sin
# sesion interactiva. Hoy no existe --- medido: `gh secret list` devuelve vacio
# en los tres repos del nucleo.
# ---------------------------------------------------------------------------

name: canal editorial

on:
  # Manual primero, SIEMPRE. Antes de que exista un cron hay que ver una
  # corrida entera en este entorno, que es justo lo que nadie ha visto.
  workflow_dispatch:
    inputs:
      limite:
        description: "Maximo de piezas a redactar en esta corrida"
        required: true
        default: "1"
      con_redactor:
        description: "Invocar al modelo (false = solo detectar y verificar)"
        type: boolean
        default: false

  # EL CRON VA COMENTADO A PROPOSITO. Descomentarlo es la activacion.
  # Lunes a viernes, 13:00 UTC = 07:00 en Ciudad de Mexico.
  # schedule:
  #   - cron: "0 13 * * 1-5"

# --- 1. EXCLUSION DE EJECUCIONES SIMULTANEAS -------------------------------
# La bitacora es append-only y `plegar()` recompone el estado leyendola entera.
# Dos corridas a la vez escribirian transiciones intercaladas sobre el mismo
# id, que es exactamente como se corrompe. `cancel-in-progress: false` es
# deliberado: se ENCOLA, no se mata. Matar una corrida a mitad deja trabajo en
# un estado intermedio que nadie cerro.
concurrency:
  group: canal-editorial
  cancel-in-progress: false

permissions:
  contents: write        # para commitear la bitacora y el corpus a su rama
  pull-requests: write   # para refrescar el PR de revision
  # Nada mas. Sin `packages`, sin `id-token`, sin `actions`.

jobs:
  corrida:
    runs-on: ubuntu-latest

    # --- 4. LIMITE DE DURACION ---------------------------------------------
    # Un canal que se cuelga consumiendo minutos es peor que uno que no corre.
    timeout-minutes: 25

    env:
      # --- 6. LA CREDENCIAL --------------------------------------------------
      # Se suministra como SECRET DEL REPOSITORIO, nunca en el archivo. El CLI
      # la lee del entorno; `execFileSync` hereda el entorno del proceso, asi
      # que no hace falta tocar `invocar-redactor.mjs`.
      #
      # NO VERIFICADO EN ESTE ENTORNO: que el CLI autentique con API key dentro
      # de un runner no se ha probado, porque el secret no existe. Es el primer
      # supuesto que hay que comprobar al activar, y puede que obligue a usar
      # `CLAUDE_CODE_OAUTH_TOKEN` (que genera `claude setup-token`) en su lugar.
      #
      # De donde sale: de una llave NUEVA que crea Rodrigo. No se reutiliza
      # ninguna credencial de otro servicio ni de ninguna sesion personal.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # --- 4. LIMITES DE CONSUMO --------------------------------------------
      EDITORIAL_MAX_PIEZAS: ${{ inputs.limite || '1' }}
      # Tope duro de llamadas al modelo por corrida. Con `--limite 1` el canal
      # invoca una vez por pieza mas los juicios de verificacion; este tope
      # existe para que un bucle inesperado no se coma el presupuesto.
      EDITORIAL_MAX_LLAMADAS: "40"

    steps:
      - uses: actions/checkout@v4
        with:
          # La rama de trabajo, NUNCA develop ni main. La publicacion sigue
          # desactivada y el corpus sigue siendo una propuesta en revision.
          ref: feat/plataforma-editorial-y-actividad
          # Historial completo: el commit de estado se hace sobre esta rama.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: instalar dependencias
        run: npm ci

      # --- 3. RECUPERACION ---------------------------------------------------
      # La corrida NO arranca del feed: arranca de la bitacora. Lo que quedo a
      # medias en la corrida anterior --- por fallo, por timeout o porque el
      # runner murio --- vuelve a la cola antes que lo detectado hoy. Esto ya lo
      # hace `ejecutar.mjs`; el paso existe para dejar constancia del estado de
      # entrada, que es lo que permite auditar una recuperacion.
      # NOTA: `estado.mjs` es una biblioteca y NO tiene CLI. Una version anterior
      # de este archivo invocaba `estado.mjs --instantanea`, que no existe y no
      # imprimia nada --- un paso verde que no comprobaba nada. Se usa el
      # registro de corridas, que si es ejecutable y ya esta saneado.
      - name: estado antes de la corrida
        run: node scripts/editorial/registro-de-corridas.mjs | tail -5

      - name: corrida
        id: corrida
        # `--limite` acota cuantas piezas se redactan. Los reintentos por
        # entrada estan topados en el propio estado (MAX_INTENTOS = 3): una
        # entrada que falla tres veces se descarta con motivo, no se reintenta
        # para siempre.
        run: |
          set +e
          if [ "${{ inputs.con_redactor }}" = "true" ]; then
            node scripts/editorial/ejecutar.mjs --con-redactor --limite "$EDITORIAL_MAX_PIEZAS"
          else
            node scripts/editorial/ejecutar.mjs --limite "$EDITORIAL_MAX_PIEZAS"
          fi
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          # 0 = exito, 2 = exito parcial (hubo fallos con constancia). Los dos
          # son resultados legitimos y NO tumban el workflow: el canal esta
          # disenado para que un fallo de acceso deje registro en vez de
          # fabricar una noticia. Solo 1 es un fallo de verdad.
          [ "$codigo" = "1" ] && exit 1
          exit 0

      # --- 5. REGISTROS CONSULTABLES, SIN CONTENIDO SENSIBLE -----------------
      # `registro-de-corridas.mjs` deriva la bitacora a un registro que NO lleva
      # titulos, URLs, prompts ni nombres de repositorio. Es lo que se puede
      # mirar para saber si el canal corre, sin publicar lo que leyo.
      - name: registro de la corrida
        if: always()
        run: node scripts/editorial/registro-de-corridas.mjs > registro-corrida.txt

      - name: publicar el registro como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-canal-${{ github.run_number }}
          path: registro-corrida.txt
          retention-days: 30

      # --- 0. LA COMPUERTA DE EXPOSICION -------------------------------------
      # Antes de commitear NADA. Este repositorio es publico y la corrida acaba
      # de escribir en disco: si algo de lo que entro nombra un repositorio
      # privado, se para aqui y no se commitea.
      - name: compuerta de exposicion
        run: node scripts/auditoria-exposicion.mjs

      # --- 1 y 2. PERSISTENCIA DE PENDIENTES Y RESULTADOS --------------------
      # La bitacora y el corpus se commitean a la MISMA rama de trabajo. Asi el
      # trabajo pendiente sobrevive al runner, que es efimero, y cada cambio
      # queda en el historial con su corrida.
      #
      # Solo estas dos rutas. Nunca `public/proof/v1/**`, que es zona prohibida.
      - name: persistir estado y corpus
        if: always()
        run: |
          git config user.name  "canal-editorial[bot]"
          git config user.email "canal-editorial@users.noreply.github.com"
          git add scripts/editorial/estado/ docs/plataforma/prototipo/datos/piezas.json
          if git diff --cached --quiet; then
            echo "sin cambios de estado: nada que persistir"
            exit 0
          fi
          git commit -m "chore(canal): corrida ${{ github.run_number }} — estado y corpus

          Corrida automatica. Codigo de salida: ${{ steps.corrida.outputs.codigo }}.
          Publicacion desactivada: las piezas siguen en borrador y con revision
          humana pendiente."
          git push origin HEAD:feat/plataforma-editorial-y-actividad
